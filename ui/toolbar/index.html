<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discowl Toolbar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .toolbar {
            display: flex;
            align-items: center;
            padding: 0 12px;
            height: 40px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            gap: 8px;
        }
        
        .toolbar-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            color: #333;
            transition: background 0.15s;
        }
        
        .toolbar-button:hover {
            background: #e8e8e8;
        }
        
        .toolbar-button:active {
            background: #d0d0d0;
        }
        
        .url-bar-container {
            flex: 1;
            max-width: 600px;
            height: 32px;
        }
        
        .url-bar {
            width: 100%;
            height: 100%;
            padding: 0 12px;
            border: 1px solid #d0d0d0;
            border-radius: 16px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        
        .url-bar:focus {
            border-color: #4285f4;
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
        }
        
        .tab-strip {
            display: flex;
            align-items: flex-end;
            height: 36px;
            padding: 0 4px;
            background: #f0f0f0;
            border-bottom: 1px solid #e0e0e0;
            overflow-x: auto;
        }
        
        .tab {
            display: flex;
            align-items: center;
            min-width: 160px;
            max-width: 240px;
            height: 32px;
            padding: 0 12px;
            margin-right: 2px;
            background: #e0e0e0;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }
        
        .tab.active {
            background: #fff;
            border-bottom: 1px solid #fff;
            margin-bottom: -1px;
        }
        
        .tab:hover:not(.active) {
            background: #d8d8d8;
        }
        
        .tab-favicon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        
        .tab-title {
            flex: 1;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #333;
        }
        
        .tab-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            border-radius: 4px;
            color: #666;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s, background 0.15s;
        }
        
        .tab:hover .tab-close {
            opacity: 1;
        }
        
        .tab-close:hover {
            background: #c0c0c0;
            color: #fff;
        }
        
        .new-tab-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 4px;
            color: #333;
            cursor: pointer;
            transition: background 0.15s;
            margin-left: 4px;
        }
        
        .new-tab-button:hover {
            background: #e8e8e8;
        }
        
        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 4px;
            color: #333;
            cursor: pointer;
            transition: background 0.15s;
        }
        
        .sidebar-toggle:hover {
            background: #e8e8e8;
        }
        
        .sidebar-toggle.active {
            background: #e3f2fd;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="toolbar-button" id="back-btn" title="Back" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </button>
        <button class="toolbar-button" id="forward-btn" title="Forward" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        </button>
        <button class="toolbar-button" id="reload-btn" title="Reload">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
            </svg>
        </button>
        <button class="toolbar-button" id="home-btn" title="Home">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </button>
        
        <div class="url-bar-container">
            <input type="text" class="url-bar" id="url-bar" placeholder="Search or enter address" spellcheck="false">
        </div>
        
        <button class="toolbar-button sidebar-toggle" id="sidebar-toggle" title="Sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
        </button>
        
        <button class="toolbar-button" id="menu-btn" title="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
            </svg>
        </button>
    </div>
    
    <div class="tab-strip" id="tab-strip">
        <button class="new-tab-button" id="new-tab-btn" title="New Tab">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>
    </div>

    <script>
        let tabs = [];
        let activeTabId = null;
        let sidebarOpen = false;
        
        const urlBar = document.getElementById('url-bar');
        const tabStrip = document.getElementById('tab-strip');
        const newTabBtn = document.getElementById('new-tab-btn');
        const backBtn = document.getElementById('back-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const reloadBtn = document.getElementById('reload-btn');
        const homeBtn = document.getElementById('home-btn');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        
        function sendCommand(cmd) {
            fetch('browser://ipc/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cmd)
            }).catch(console.error);
        }
        
        function renderTabs() {
            const existingTabs = tabStrip.querySelectorAll('.tab');
            existingTabs.forEach(t => t.remove());
            
            tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
                tabEl.dataset.tabId = tab.id;
                tabEl.innerHTML = `
                    ${tab.favicon ? `<img class="tab-favicon" src="${tab.favicon}" alt="">` : ''}
                    <span class="tab-title">${escapeHtml(tab.title)}</span>
                    <button class="tab-close" data-tab-id="${tab.id}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                `;
                tabStrip.insertBefore(tabEl, newTabBtn);
                
                tabEl.addEventListener('click', (e) => {
                    if (!e.target.closest('.tab-close')) {
                        sendCommand({ type: 'SwitchTab', id: tab.id });
                    }
                });
                
                tabEl.querySelector('.tab-close').addEventListener('click', (e) => {
                    e.stopPropagation();
                    sendCommand({ type: 'CloseTab', id: tab.id });
                });
            });
            
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (activeTab) {
                urlBar.value = activeTab.url;
                backBtn.disabled = !activeTab.can_go_back;
                forwardBtn.disabled = !activeTab.can_go_forward;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        window.onCoreEvent = function(event) {
            switch (event.type) {
                case 'TabsChanged':
                    tabs = event.tabs;
                    activeTabId = event.active;
                    renderTabs();
                    break;
                case 'TabUpdated':
                    const tabIndex = tabs.findIndex(t => t.id === event.id);
                    if (tabIndex >= 0) {
                        tabs[tabIndex] = { ...tabs[tabIndex], ...event };
                        if (event.id === activeTabId) {
                            urlBar.value = event.url;
                            backBtn.disabled = !event.can_go_back;
                            forwardBtn.disabled = !event.can_go_forward;
                        }
                        renderTabs();
                    }
                    break;
                case 'SidebarToggled':
                    sidebarOpen = event.open;
                    sidebarToggle.classList.toggle('active', event.open);
                    break;
            }
        };
        
        function focusUrlBar() {
            urlBar.focus();
            urlBar.select();
        }
        
        window.focusUrlBar = focusUrlBar;
        
        urlBar.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const input = urlBar.value.trim();
                if (input) {
                    sendCommand({ type: 'Navigate', id: activeTabId, input });
                }
            }
        });
        
        newTabBtn.addEventListener('click', () => {
            sendCommand({ type: 'NewTab', url: null });
        });
        
        backBtn.addEventListener('click', () => {
            if (activeTabId) sendCommand({ type: 'GoBack', id: activeTabId });
        });
        
        forwardBtn.addEventListener('click', () => {
            if (activeTabId) sendCommand({ type: 'GoForward', id: activeTabId });
        });
        
        reloadBtn.addEventListener('click', () => {
            if (activeTabId) sendCommand({ type: 'Reload', id: activeTabId });
        });
        
        homeBtn.addEventListener('click', () => {
            if (activeTabId) sendCommand({ type: 'Navigate', id: activeTabId, input: 'https://duckduckgo.com' });
        });
        
        sidebarToggle.addEventListener('click', () => {
            sendCommand({ type: 'ToggleSidebar' });
        });
        
        // Initialize
        fetch('browser://ipc/init').catch(console.error);
    </script>
</body>
</html>
