<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .logo { font-size: 48px; font-weight: 300; color: #1a73e8; margin-bottom: 24px; }
        .search-box { width: 584px; }
        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .search-input:hover, .search-input:focus {
            border-color: transparent;
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
        }
        .shortcuts { display: flex; gap: 16px; margin-top: 24px; flex-wrap: wrap; justify-content: center; }
        .shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 24px;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #3c4043;
            font-size: 14px;
            min-width: 120px;
            transition: background 0.2s;
        }
        .shortcut:hover { background: #e8eaed; }
        .shortcut-icon { width: 32px; height: 32px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="logo">Discowl</div>
    <div class="search-box">
        <input type="text" class="search-input" id="search-input" placeholder="Search the web" autofocus spellcheck="false">
    </div>
    <div class="shortcuts" id="shortcuts"></div>
    
    <script>
        const shortcuts = [
            { title: 'DuckDuckGo', url: 'https://duckduckgo.com', icon: '🦆' },
            { title: 'GitHub', url: 'https://github.com', icon: '🐙' },
            { title: 'MDN', url: 'https://developer.mozilla.org', icon: '📚' },
            { title: 'Rust', url: 'https://rust-lang.org', icon: '🦀' },
        ];
        
        const container = document.getElementById('shortcuts');
        shortcuts.forEach(s => {
            const a = document.createElement('a');
            a.className = 'shortcut';
            a.href = s.url;
            a.innerHTML = `<span class="shortcut-icon">${s.icon}</span>${s.title}`;
            container.appendChild(a);
        });
        
        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const q = encodeURIComponent(e.target.value.trim());
                if (q) window.location.href = `https://duckduckgo.com/?q=${q}`;
            }
        });
    </script>
</body>
</html>
