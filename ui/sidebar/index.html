<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discowl Sidebar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
        }
        
        .sidebar-header {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        
        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .sidebar-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        
        .sidebar-tab:hover {
            color: #333;
            background: #f5f5f5;
        }
        
        .sidebar-tab.active {
            color: #1976d2;
            border-bottom-color: #1976d2;
        }
        
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .sidebar-section {
            margin-bottom: 16px;
        }
        
        .sidebar-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #999;
            padding: 0 8px;
            margin-bottom: 8px;
        }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }
        
        .sidebar-item:hover {
            background: #f0f0f0;
        }
        
        .sidebar-item-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            color: #666;
            flex-shrink: 0;
        }
        
        .sidebar-item-title {
            flex: 1;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #333;
        }
        
        .sidebar-item-url {
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }
        
        .empty-state {
            text-align: center;
            padding: 24px;
            color: #999;
            font-size: 13px;
        }
        
        .sidebar-panel {
            display: none;
        }
        
        .sidebar-panel.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="sidebar-header">Sidebar</div>
    
    <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-panel="history">History</button>
        <button class="sidebar-tab" data-panel="bookmarks">Bookmarks</button>
        <button class="sidebar-tab" data-panel="downloads">Downloads</button>
    </div>
    
    <div class="sidebar-content">
        <div class="sidebar-panel active" id="history-panel">
            <div class="sidebar-section-title">Today</div>
            <div id="history-list" class="sidebar-section">
                <div class="empty-state">No history yet</div>
            </div>
        </div>
        
        <div class="sidebar-panel" id="bookmarks-panel">
            <div class="sidebar-section-title">Bookmarks</div>
            <div id="bookmarks-list" class="sidebar-section">
                <div class="empty-state">No bookmarks yet</div>
            </div>
        </div>
        
        <div class="sidebar-panel" id="downloads-panel">
            <div class="sidebar-section-title">Recent Downloads</div>
            <div id="downloads-list" class="sidebar-section">
                <div class="empty-state">No downloads yet</div>
            </div>
        </div>
    </div>

    <script>
        let history = [];
        let bookmarks = [];
        let downloads = [];
        
        const tabButtons = document.querySelectorAll('.sidebar-tab');
        const panels = document.querySelectorAll('.sidebar-panel');
        
        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.panel + '-panel').classList.add('active');
            });
        });
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        function renderHistory() {
            const container = document.getElementById('history-list');
            if (history.length === 0) {
                container.innerHTML = '<div class="empty-state">No history yet</div>';
                return;
            }
            
            container.innerHTML = history.map(item => `
                <div class="sidebar-item" data-url="${escapeHtml(item.url)}">
                    <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span class="sidebar-item-title">${escapeHtml(item.title)}</span>
                    <span class="sidebar-item-url">${escapeHtml(item.url)}</span>
                </div>
            `).join('');
            
            container.querySelectorAll('.sidebar-item').forEach(item => {
                item.addEventListener('click', () => {
                    window.parent.postMessage({ type: 'Navigate', input: item.dataset.url }, '*');
                });
            });
        }
        
        function renderBookmarks() {
            const container = document.getElementById('bookmarks-list');
            if (bookmarks.length === 0) {
                container.innerHTML = '<div class="empty-state">No bookmarks yet</div>';
                return;
            }
            
            container.innerHTML = bookmarks.map(item => `
                <div class="sidebar-item" data-url="${escapeHtml(item.url)}">
                    <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
                    </svg>
                    <span class="sidebar-item-title">${escapeHtml(item.title)}</span>
                    <span class="sidebar-item-url">${escapeHtml(item.url)}</span>
                </div>
            `).join('');
            
            container.querySelectorAll('.sidebar-item').forEach(item => {
                item.addEventListener('click', () => {
                    window.parent.postMessage({ type: 'Navigate', input: item.dataset.url }, '*');
                });
            });
        }
        
        function renderDownloads() {
            const container = document.getElementById('downloads-list');
            if (downloads.length === 0) {
                container.innerHTML = '<div class="empty-state">No downloads yet</div>';
                return;
            }
            
            container.innerHTML = downloads.map(item => `
                <div class="sidebar-item">
                    <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                    </svg>
                    <span class="sidebar-item-title">${escapeHtml(item.file_path.split('/').pop() || item.url)}</span>
                </div>
            `).join('');
        }
        
        window.onCoreEvent = function(event) {
            switch (event.type) {
                case 'TabsChanged':
                    break;
                case 'TabUpdated':
                    break;
                case 'SidebarToggled':
                    break;
            }
        };
        
        // Listen for messages from parent
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type) {
                switch (e.data.type) {
                    case 'HistoryUpdate':
                        history = e.data.history;
                        renderHistory();
                        break;
                    case 'BookmarksUpdate':
                        bookmarks = e.data.bookmarks;
                        renderBookmarks();
                        break;
                    case 'DownloadsUpdate':
                        downloads = e.data.downloads;
                        renderDownloads();
                        break;
                }
            }
        });
    </script>
</body>
</html>
