[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/engine",
    "crates/browser-core",
    "crates/ipc",
    "crates/storage",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.88"

[workspace.dependencies]
# Core dependencies
servo = { version = "0.8", features = ["default"] }
winit = { version = "0.30", features = ["serde"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4", "serde"] }
url = "2.0"
urlencoding = "2.0"
euclid = { version = "0.22", features = ["serde"] }

# Storage
rusqlite = { version = "0.38", features = ["bundled", "serde_json"] }
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# Embedding
include_dir = "0.7"
rust-embed = { version = "8.0", features = ["include_dir"] }

[profile.dev]
debug = false
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1